[project]
name = "uruguay_dua_comex"
version = "0.1.0"
description = "Análisis de datos de la Dirección Nacional de Aduanas (DUA) para comercio exterior en Uruguay"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    {name = "Fernanda Aguirre Ruiz"}
]

dependencies = [
    "ipykernel",
    "nbformat",
    "pandas",
    "polars",
    "numpy",
    "requests",
    "plotnine",
    "openpyxl",
    "pyprojroot",
    "tqdm>=4.70.1",
    "xlsxwriter>=3.2.9",
]

[build-system]
requires = ["hatchling>=1.0.0"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "ruff>=0.16.10",
    "types-requests>=2.33.0.20261006",
    "types-tqdm>=4.70.0.20260906",
]
